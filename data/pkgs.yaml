packages:
  - { name: "forge", chip: "F", desc: "Light, secure Git forge: hosting, web UI, admin gRPC, Actions runners via GARM. Milestone 2a: the admin gRPC API and its CLI, with a FIDO2 signature on every change, are implemented; hosting, sign-in and the web UI are design only.", url: "https://github.com/go-vcs/forge", doc: "https://pkg.go.dev/github.com/go-vcs/forge" }
  - { name: "gitproto", chip: "P", desc: "Git wire protocol v2 and pack files, fuzzed and measured against git.", url: "https://github.com/go-vcs/gitproto", doc: "https://pkg.go.dev/github.com/go-vcs/gitproto" }
  - { name: "actions", chip: "A", desc: "GitHub Actions workflow engine and gitea-runner protocol server. Not started: the repository holds a licence and a README.", url: "https://github.com/go-vcs/actions", doc: "https://pkg.go.dev/github.com/go-vcs/actions" }
