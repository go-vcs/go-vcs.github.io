packages:
  - { name: "forge", chip: "F", desc: "Light, secure Git forge: hosting, web UI, admin gRPC, Actions runners via GARM. Milestone 3: FIDO2-signed admin API, read-only clone over SSH and HTTPS, OIDC sign-in and a read-only web UI are implemented; push is design only.", url: "https://github.com/go-vcs/forge", doc: "https://pkg.go.dev/github.com/go-vcs/forge" }
  - { name: "gitproto", chip: "P", desc: "Git wire protocol v2, fetch side, v0.1.0: fuzzed, 0.93 to 0.96 of git upload-pack's time on a full clone.", url: "https://github.com/go-vcs/gitproto", doc: "https://pkg.go.dev/github.com/go-vcs/gitproto" }
  - { name: "actions", chip: "A", desc: "GitHub Actions workflow engine and gitea-runner protocol server. Not started: the repository holds a licence and a README.", url: "https://github.com/go-vcs/actions", doc: "https://pkg.go.dev/github.com/go-vcs/actions" }
  - { name: "agentd", chip: "D", desc: "Local daemon between many agent sessions and GitHub: one poller per commit, no token in an agent, a verdict bound to one exact commit, and a merge only if that commit is still the head and green.", url: "https://github.com/go-vcs/agentd", doc: "https://pkg.go.dev/github.com/go-vcs/agentd" }
